text cx=60 cy=240 label="POTENTIALWAX: DIG, FLIP, PLAY" size=1.9 weight=700 align=left color=0e1f1b when=manual_page:0
text cx=60 cy=280 label="A melodic sampler. Pick a song from your own library, or let it dig one out, and it finds 16 cue points, works" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:0
text cx=60 cy=312 label="out the tempo and key, and matches them to your project." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:0
text cx=62 cy=360 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:0
text cx=84 cy=360 label="Load it as a plugin instrument (a plugin program). The pads play from the cues." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:0
text cx=62 cy=392 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:0
text cx=84 cy=392 label="It needs a folder of songs: put them in a folder called MELODIC LIBRARY at the top of an SD card, USB drive" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:0
text cx=84 cy=424 label="or SSD." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:0
text cx=62 cy=456 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:0
text cx=84 cy=456 label="MP3, WAV and FLAC. After adding songs, tap RESCAN on the BROWSE page." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:0
text cx=62 cy=488 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:0
text cx=84 cy=488 label="Tap RANDOM TRACK, or ROLL for a random song played a random way." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:0
text cx=60 cy=536 label="The full PotentialSuite manual: github.com/PotentialBreakfast/potential-plugins" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:0
text cx=60 cy=240 label="WAX PAGE" size=1.9 weight=700 align=left color=0e1f1b when=manual_page:1
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:1
text cx=84 cy=280 label="RANDOM TRACK digs out a song. PREV and NEXT step through them. LIBRARY switches folders. BROWSE lists 10 at a" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:1
text cx=84 cy=312 label="time." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:1
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:1
text cx=84 cy=344 label="CUES ON: where the 16 cues go. Phrases (4-bar phrase starts), Bars or Hits. FIND CUES rolls a new set." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:1
text cx=62 cy=376 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:1
text cx=84 cy=376 label="NUDGE moves the last pad's cue." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:1
text cx=62 cy=408 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:1
text cx=84 cy=408 label="BEAT CHOP puts the 16 pads one beat apart: 4 bars, from the bar of the last pad you played." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:1
text cx=62 cy=440 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:1
text cx=84 cy=440 label="MODE: Pads (each pad plays from its cue) or Keys (the last pad, spread over the keyboard from the ROOT note)." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:1
text cx=62 cy=472 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:1
text cx=84 cy=472 label="PAD PLAYS: Hold, To Next Cue, 1 Bar or 2 Bars." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:1
text cx=62 cy=504 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:1
text cx=84 cy=504 label="/2 and x2 halve or double the tempo it found, for half-time and double-time samples." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:1
text cx=62 cy=536 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:1
text cx=84 cy=536 label="PLAY SONG and STOP play the whole song." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:1
text cx=60 cy=240 label="TEMPO AND KEY" size=1.9 weight=700 align=left color=0e1f1b when=manual_page:2
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:2
text cx=84 cy=280 label="TEMPO: Original, or Match MPC." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:2
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:2
text cx=84 cy=312 label="KEY: Original, or any key from C to B. It moves the shortest way. PITCH adds up to 12 semitones each way on" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:2
text cx=84 cy=344 label="top." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:2
text cx=62 cy=376 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:2
text cx=84 cy=376 label="KEY LOCK keeps one key for everything you dig. Switch it on with KEY on Original to take the key of the song" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:2
text cx=84 cy=408 label="you are on." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:2
text cx=62 cy=440 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:2
text cx=84 cy=440 label="PITCHING: Keep Tempo (time-stretch, the speed stays put) or Vinyl (speed and pitch move together, like a" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:2
text cx=84 cy=472 label="turntable)." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:2
text cx=62 cy=504 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:2
text cx=84 cy=504 label="The MPC does not tell plugins the project's key, so KEY is where you set it." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:2
text cx=62 cy=536 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:2
text cx=84 cy=536 label="A file that is a whole number of bars (1, 2, 4, 8, 16 or 32) is recognised as a cut loop and gets its exact" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:2
text cx=84 cy=568 label="tempo." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:2
text cx=62 cy=600 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:2
text cx=84 cy=600 label="Tempo is found between 75 and 150 BPM, or read from a name like 92bpm." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:2
text cx=60 cy=240 label="WAVE PAGE" size=1.9 weight=700 align=left color=0e1f1b when=manual_page:3
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:3
text cx=84 cy=280 label="The song's waveform with all 16 cues. Playing a pad selects it. PAD arrows pick one without playing." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:3
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:3
text cx=84 cy=312 label="FLIP: REVERSE plays the selected pad backwards, HALF SPEED an octave down, FILTER puts a low-pass on it. Each" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:3
text cx=84 cy=344 label="pad keeps its own." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:3
text cx=62 cy=376 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:3
text cx=84 cy=376 label="VIEW: the whole song, or 16, 4 or 1 bar around the selected cue." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:3
text cx=62 cy=408 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:3
text cx=84 cy=408 label="Move the selected cue by a bar, a beat, a 1/16 note or a tiny step (5 ms). PLAY PAD to hear it." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:3
text cx=62 cy=440 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:3
text cx=84 cy=440 label="SNAP TO HIT moves the cue onto the nearest real hit. RESET CUE puts it back where it was found." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:3
text cx=60 cy=240 label="SAVING YOUR WORK" size=1.9 weight=700 align=left color=0e1f1b when=manual_page:4
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:4
text cx=84 cy=280 label="Your project remembers the song, the cues and every setting." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:4
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:4
text cx=84 cy=312 label="SAVE KIT writes an MPC drum program: each pad as a WAV, as you hear it (tempo, key, pitch and flips), on pads" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:4
text cx=84 cy=344 label="A01 to A16, with a MIDI file that plays the pads in order. MPC OS 3.10.1 or later." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:4
text cx=62 cy=376 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:4
text cx=84 cy=376 label="SAVE PADS writes the 16 chops as WAV files." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:4
text cx=62 cy=408 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:4
text cx=84 cy=408 label="Kits go to PotentialWax/Kits on the song's drive, pads to the PotentialWax folder there." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:4
text cx=60 cy=460 label="WHERE IT FINDS YOUR SONGS" size=1.9 weight=700 align=left color=0e1f1b when=manual_page:4
text cx=62 cy=500 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:4
text cx=84 cy=500 label="A folder called MELODIC LIBRARY at the top of any drive." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:4
text cx=62 cy=532 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:4
text cx=84 cy=532 label="Any folder at the top of a drive with melodic, wax, flip or songs in its name." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:4
text cx=62 cy=564 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:4
text cx=84 cy=564 label="Folders you list in PotentialWax/folders.txt on that drive, one per line." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:4
text cx=60 cy=240 label="WITH THE OTHER PLUGINS" size=1.9 weight=700 align=left color=0e1f1b when=manual_page:5
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:5
text cx=84 cy=280 label="Dusty Loop chain on the Wax track (soul, jazz and library loops): Bleed > Patina > Grit, the same preset name" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:5
text cx=84 cy=312 label="in each." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:5
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:5
text cx=84 cy=344 label="90s Stab chain for chopped horns, keys and vocal stabs: Grit > Punch > Bleed > Patina." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:5
text cx=62 cy=376 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:5
text cx=84 cy=376 label="PotentialCrates finds and plays records. Record what you like into the MPC, save it to your MELODIC LIBRARY" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:5
text cx=84 cy=408 label="folder, RESCAN, and flip it here." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:5
text cx=62 cy=440 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:5
text cx=84 cy=440 label="PotentialWarp as the last insert for half time and tape stops on the chops." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:5
text cx=60 cy=488 label="Effects go on the track's inserts. SAVE KIT saves the pads as you hear them in the plugin, before the track's" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:5
text cx=60 cy=520 label="effects." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:5
text cx=60 cy=240 label="GOOD TO KNOW" size=1.9 weight=700 align=left color=0e1f1b when=manual_page:6
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:6
text cx=84 cy=280 label="If pad 1 does not play the first cue, use LEARN on the SETUP page, then hit the pad you want as pad 1." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:6
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:6
text cx=84 cy=312 label="Only the first 6 minutes of a song are used. Files shorter than about 2 seconds are skipped." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:6
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:6
text cx=84 cy=344 label="Tempo, key and cues are a best guess. Putting the BPM in the file name fixes the tempo." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:6
text cx=62 cy=376 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:6
text cx=84 cy=376 label="Keep Tempo sounds more stretched on big tempo or key changes. Vinyl has no stretch artefacts." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:6
text cx=62 cy=408 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:6
text cx=84 cy=408 label="8 voices, 44.1 kHz playback. CHOKE and RELEASE are on the SETUP page." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:6
text cx=62 cy=440 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:6
text cx=84 cy=440 label="Q-Links: PITCH, VOLUME, TEMPO, KEY, CUES ON, PAD PLAYS, MODE and PITCHING." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:6
text cx=62 cy=472 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:6
text cx=84 cy=472 label="Looks: Print Plate, Night Rack or Colour Block, on the SETUP page." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:6
text cx=60 cy=520 label="Ideas, bugs and criticism are all welcome: github.com/PotentialBreakfast/mpc-vst-potentialwax" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:6
