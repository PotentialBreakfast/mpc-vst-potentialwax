name: 💡 Idea or request
description: A new feature or a change to PotentialWax, or a new plugin you'd like to see
labels: [idea]
body:
  - type: markdown
    attributes:
      value: |
        Ideas of every size are welcome – "it'd be nice if…" is a great start. Criticism is welcome too.
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like, and how would you use it in a beat?
    validations:
      required: true
